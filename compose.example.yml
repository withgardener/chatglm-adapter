services:
  chatglm-adapter:
    build: .
    image: chatglm-adapter:0.1.0
    expose:
      - "8000"
    environment:
      ADAPTER_INTERNAL_API_KEY: ${ADAPTER_INTERNAL_API_KEY:?set ADAPTER_INTERNAL_API_KEY}
      CHATGLM_REFRESH_TOKEN_FILE: /run/secrets/chatglm_refresh_token
      # Optional full-cookie import. The cookie file must be writable by the
      # container user (rotation rewrites it), so prefer a bind mount with
      # mode 0600, uid 10001 over a read-only Docker secret.
      CHATGLM_COOKIES_FILE: ${CHATGLM_COOKIES_FILE:-}
      CHATGLM_DEVICE_ID_FILE: /data/device-id
      CHATGLM_STREAM_URL: https://chatglm.cn/chatglm/backend-api/assistant/stream
      CHATGLM_UPLOAD_URL: ${CHATGLM_UPLOAD_URL:-https://chatglm.cn/chatglm/productivity-api/file/chat_upload}
      CHATGLM_SIGN_SECRET: ${CHATGLM_SIGN_SECRET:?set the verified sign secret}
      CHATGLM_TIMESTAMP_FORMAT: ${CHATGLM_TIMESTAMP_FORMAT:-chatglm_checksum}
      CHATGLM_AUTH_REFRESH_URL: ${CHATGLM_AUTH_REFRESH_URL:-https://chatglm.cn/chatglm/user-api/user/refresh}
      CHATGLM_TIME_SYNC_URL: ${CHATGLM_TIME_SYNC_URL:-https://chatglm.cn/chatglm/operation-api/config/cur_ts}
      CHATGLM_ASSISTANT_ID: ${CHATGLM_ASSISTANT_ID:-65940acff94777010aa6b796}
      CHATGLM_MODEL_GLM_5_3: ${CHATGLM_MODEL_GLM_5_3:-glm-5.3}
      CHATGLM_MODEL_GLM_5_3_FLASH: ${CHATGLM_MODEL_GLM_5_3_FLASH:-glm-5.3-flash}
      CHATGLM_CONVERSATION_DELETE_URL: ${CHATGLM_CONVERSATION_DELETE_URL:-https://chatglm.cn/chatglm/mainchat-api/conversation/delete}
    volumes:
      - chatglm-adapter-data:/data
    secrets:
      - chatglm_refresh_token
    networks:
      - ai-backend

secrets:
  chatglm_refresh_token:
    file: ./secrets/chatglm_refresh_token

volumes:
  chatglm-adapter-data:

networks:
  ai-backend:
    external: true
